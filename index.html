<!doctype html>
<html lang="id">
  <head>
    <script>
      // Redam dan cegah error websocket HMR Vite di lingkungan preview/sandbox Cloud Run
      (function() {
        if (typeof window !== 'undefined') {
          var RealWebSocket = window.WebSocket;
          if (RealWebSocket) {
            function MockHmrSocket(url, protocols) {
              if (protocols === 'vite-hmr' || protocols === 'vite-ping') {
                var target = new EventTarget();
                target.url = url;
                target.readyState = 1;
                target.send = function() {};
                target.close = function() {};
                setTimeout(function() {
                  var openEvt = new Event('open');
                  target.dispatchEvent(openEvt);
                  if (typeof target.onopen === 'function') target.onopen(openEvt);
                }, 0);
                return target;
              }
              return new RealWebSocket(url, protocols);
            }
            MockHmrSocket.prototype = RealWebSocket.prototype;
            MockHmrSocket.OPEN = 1;
            MockHmrSocket.CONNECTING = 0;
            MockHmrSocket.CLOSING = 2;
            MockHmrSocket.CLOSED = 3;
            window.WebSocket = MockHmrSocket;
          }

          var origConsoleError = console.error;
          console.error = function() {
            var args = Array.prototype.slice.call(arguments);
            var text = args.map(function(item) {
              return (item && (item.message || item.toString())) || '';
            }).join(' ');
            if (
              text.indexOf('WebSocket') !== -1 ||
              text.indexOf('websocket') !== -1 ||
              text.indexOf('failed to connect to websocket') !== -1 ||
              text.indexOf('closed without opened') !== -1
            ) {
              return;
            }
            return origConsoleError.apply(console, arguments);
          };

          function isWsError(msg) {
            return typeof msg === 'string' && (
              msg.indexOf('WebSocket') !== -1 ||
              msg.indexOf('websocket') !== -1 ||
              msg.indexOf('closed without opened') !== -1 ||
              msg.indexOf('failed to connect to websocket') !== -1
            );
          }
          window.addEventListener('unhandledrejection', function(e) {
            var reason = e && (e.reason || e);
            var msg = (reason && (reason.message || String(reason))) || '';
            if (isWsError(msg)) {
              e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            }
          }, true);
          window.addEventListener('error', function(e) {
            var msg = (e && (e.message || String(e))) || '';
            if (isWsError(msg)) {
              e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            }
          }, true);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pencatatan Transaksi Mini ATM</title>
    <meta name="description" content="Sistem pencatatan transaksi Agen Link Bersama & Mini ATM, analisis laporan visual, arus kas, kasir POS, dan cetak struk thermal." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
